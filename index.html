<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>1秒Vlog合体Cam</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; text-align: center; margin: 0; }
        video#preview { width: 100%; height: 45vh; background: #000; object-fit: cover; }
        .controls { padding: 15px; display: flex; flex-direction: column; align-items: center; gap: 15px; }
        #recBtn { width: 70px; height: 70px; border-radius: 50%; border: 5px solid white; background: #ff4444; }
        #exportBtn { padding: 10px 20px; border-radius: 20px; border: none; background: #4444ff; color: white; font-weight: bold; display: none; }
        #status { color: #00ff00; font-size: 0.9rem; min-height: 1.2rem; }
        .vlog-list { display: flex; overflow-x: auto; gap: 5px; padding: 10px; background: #222; }
        video.clip { width: 80px; height: 80px; object-fit: cover; border-radius: 4px; }
    </style>
</head>
<body>
    <video id="preview" autoplay playsinline muted></video>
    <div class="controls">
        <div id="status"></div>
        <button id="recBtn"></button>
        <button id="exportBtn">🎬 1本の動画にして保存</button>
    </div>
    <div style="font-size: 0.8rem; color: #888;">今回の撮影リスト</div>
    <div id="vlogList" class="vlog-list"></div>

    <script>
        let mediaRecorder;
        let recordedBlobs = []; // 撮影した1秒ずつのデータを溜める場所

        // カメラ設定
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: true })
            .then(stream => {
                document.getElementById('preview').srcObject = stream;
                
                document.getElementById('recBtn').onclick = () => {
                    const tempChunks = [];
                    const recorder = new MediaRecorder(stream);
                    
                    recorder.ondataavailable = e => tempChunks.push(e.data);
                    recorder.onstop = () => {
                        const blob = new Blob(tempChunks, { type: 'video/mp4' });
                        recordedBlobs.push(blob); // リストに追加
                        
                        // プレビュー表示
                        const video = document.createElement('video');
                        video.src = URL.createObjectURL(blob);
                        video.className = 'clip';
                        document.getElementById('vlogList').appendChild(video);
                        
                        document.getElementById('exportBtn').style.display = "block";
                        document.getElementById('status').innerText = `${recordedBlobs.length}個のシーンを記録中`;
                    };

                    recorder.start();
                    document.getElementById('status').innerText = "録画中...";
                    setTimeout(() => recorder.stop(), 1000); // 1秒で止める
                };
            });

        // 「1本の動画にする」処理
        document.getElementById('exportBtn').onclick = async () => {
            document.getElementById('status').innerText = "動画を連結しています...";
            
            // 全ての動画を一つにまとめる（Blob連結）
            // ※本来は再エンコードが必要ですが、同じ設定で撮った動画なら多くの環境でこれで繋がります
            const finalBlob = new Blob(recordedBlobs, { type: 'video/mp4' });
            const url = URL.createObjectURL(finalBlob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = `my_vlog_${new Date().getTime()}.mp4`;
            a.click();
            
            document.getElementById('status').innerText = "1本の動画として保存しました！";
        };
    </script>
</body>
</html>
