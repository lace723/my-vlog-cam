<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>1秒Vlog・安全合体編</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; text-align: center; margin: 0; }
        video#preview { width: 100%; height: 40vh; background: #000; object-fit: cover; }
        .controls { padding: 15px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
        #recBtn { width: 70px; height: 70px; border-radius: 50%; border: 5px solid white; background: #ff4444; }
        #exportBtn { padding: 12px 24px; border-radius: 25px; border: none; background: #4444ff; color: white; font-weight: bold; display: none; }
        #clearBtn { background: none; border: 1px solid #555; color: #888; font-size: 0.7rem; padding: 5px 10px; border-radius: 5px; }
        #status { color: #00ff00; font-size: 0.9rem; min-height: 1.2rem; margin: 10px; }
        .vlog-list { display: flex; overflow-x: auto; gap: 5px; padding: 10px; background: #222; }
        video.clip { width: 80px; height: 80px; object-fit: cover; border-radius: 4px; }
        #hiddenCanvas { display: none; }
    </style>
</head>
<body>
    <video id="preview" autoplay playsinline muted></video>
    <div class="controls">
        <div id="status">準備中...</div>
        <button id="recBtn"></button>
        <button id="exportBtn">🎬 1本の動画に合体して保存</button>
        <button id="clearBtn" onclick="clearData()">撮影リストをリセット</button>
    </div>
    <div id="vlogList" class="vlog-list"></div>
    <canvas id="hiddenCanvas"></canvas>

    <script>
        let mediaRecorder;
        let db;
        const DB_NAME = "VlogDB_v2"; // 前回のデータベースを引き継ぎます
        const STORE_NAME = "clips";

        // DB準備
        const request = indexedDB.open(DB_NAME, 1);
        request.onupgradeneeded = e => e.target.result.createObjectStore(STORE_NAME, { autoIncrement: true });
        request.onsuccess = e => {
            db = e.target.result;
            loadClips();
            document.getElementById('status').innerText = "準備完了";
        };

        // カメラ設定
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: true })
            .then(stream => {
                document.getElementById('preview').srcObject = stream;
                document.getElementById('recBtn').onclick = () => {
                    const chunks = [];
                    const recorder = new MediaRecorder(stream);
                    recorder.ondataavailable = e => chunks.push(e.data);
                    recorder.onstop = () => saveToDB(new Blob(chunks, { type: 'video/mp4' }));
                    recorder.start();
                    document.getElementById('status').innerText = "1秒録画中...";
                    setTimeout(() => recorder.stop(), 1000);
                };
            });

        function saveToDB(blob) {
            const tx = db.transaction(STORE_NAME, "readwrite");
            tx.objectStore(STORE_NAME).add(blob);
            tx.oncomplete = () => loadClips();
        }

        function loadClips() {
            const list = document.getElementById('vlogList');
            list.innerHTML = "";
            const tx = db.transaction(STORE_NAME, "readonly");
            const store = tx.objectStore(STORE_NAME);
            let count = 0;
            store.openCursor().onsuccess = e => {
                const cursor = e.target.result;
                if (cursor) {
                    count++;
                    const video = document.createElement('video');
                    video.src = URL.createObjectURL(cursor.value);
                    video.className = 'clip';
                    list.appendChild(video);
                    cursor.continue();
                } else if (count > 0) {
                    document.getElementById('exportBtn').style.display = "block";
                    document.getElementById('status').innerText = `${count}個のシーンを保存済み`;
                }
            };
        }

        // ★改良：メモリを節約しながら順番に繋ぐ処理
        document.getElementById('exportBtn').onclick = async () => {
            const status = document.getElementById('status');
            status.innerText = "合体準備中...";
            
            // 全てのデータを一気に読まず、キー（目次）だけをまず取得
            const tx = db.transaction(STORE_NAME, "readonly");
            const keys = await new Promise(resolve => {
                tx.objectStore(STORE_NAME).getAllKeys().onsuccess = e => resolve(e.target.result);
            });

            if (keys.length === 0) return;

            const canvas = document.getElementById('hiddenCanvas');
            const ctx = canvas.getContext('2d');
            const hiddenVideo = document.createElement('video');
            hiddenVideo.muted = true;
            hiddenVideo.playsInline = true;

            // 最初の1本目だけ読み込んでサイズを決定
            const firstBlob = await getBlobByKey(keys[0]);
            const firstUrl = URL.createObjectURL(firstBlob);
            hiddenVideo.src = firstUrl;
            await new Promise(r => hiddenVideo.onloadedmetadata = r);
            canvas.width = hiddenVideo.videoWidth;
            canvas.height = hiddenVideo.videoHeight;
            URL.revokeObjectURL(firstUrl); // すぐにメモリ解放

            // 録画ストリームの開始
            const stream = canvas.captureStream(30);
            const recorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9' });
            const finalChunks = [];
            recorder.ondataavailable = e => finalChunks.push(e.data);
            recorder.start();

            // 1本ずつ、読み込み → 再生・録画 → メモリ解放 を繰り返す
            let currentIndex = 0;
            for (let key of keys) {
                currentIndex++;
                status.innerText = `動画を結合中... (${currentIndex} / ${keys.length} シーン)`;
                
                const blob = await getBlobByKey(key);
                const url = URL.createObjectURL(blob);
                hiddenVideo.src = url;
                
                await new Promise(r => hiddenVideo.onloadeddata = r);
                await hiddenVideo.play();
                
                await new Promise(resolve => {
                    const draw = () => {
                        ctx.drawImage(hiddenVideo, 0, 0, canvas.width, canvas.height);
                        if (!hiddenVideo.paused && !hiddenVideo.ended) {
                            requestAnimationFrame(draw);
                        } else {
                            resolve();
                        }
                    };
                    draw();
                });
                
                // 【最重要】使い終わった動画のメモリをその場で完全にゴミ箱に捨てる
                URL.revokeObjectURL(url);
                hiddenVideo.src = "";
                hiddenVideo.load();
            }

            recorder.stop();
            recorder.onstop = () => {
                const finalBlob = new Blob(finalChunks, { type: 'video/webm' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(finalBlob);
                a.download = `vlog_total_${Date.now()}.webm`;
                a.click();
                status.innerText = "合体完了！保存しました。";
            };
        };

        // キーを指定して1個だけ動画をデータベースから持ってくる関数
        function getBlobByKey(key) {
            return new Promise(resolve => {
                const tx = db.transaction(STORE_NAME, "readonly");
                tx.objectStore(STORE_NAME).get(key).onsuccess = e => resolve(e.target.result);
            });
        }

        function clearData() {
            if(confirm("リストを空にしますか？")) {
                const tx = db.transaction(STORE_NAME, "readwrite");
                tx.objectStore(STORE_NAME).clear();
                tx.oncomplete = () => location.reload();
            }
        }
    </script>
</body>
</html>
