<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>1秒積み上げCam</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; text-align: center; margin: 0; }
        video#preview { width: 100%; height: 50vh; background: #000; object-fit: cover; }
        .controls { padding: 20px; }
        #recBtn { width: 80px; height: 80px; border-radius: 50%; border: 5px solid white; background: #ff4444; box-shadow: 0 0 15px rgba(255,0,0,0.5); }
        #recBtn:active { transform: scale(0.9); background: #cc0000; }
        #status { color: #00ff00; height: 20px; margin: 10px 0; }
        .vlog-list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 10px; }
        video.clip { width: 100%; border-radius: 8px; border: 1px solid #333; }
    </style>
</head>
<body>
    <video id="preview" autoplay playsinline muted></video>
    <div class="controls">
        <button id="recBtn"></button>
        <div id="status"></div>
    </div>
    <div style="color:#888;">--- 撮影済みクリップ ---</div>
    <div id="vlogList" class="vlog-list"></div>

    <script>
        let mediaRecorder;
        let chunks = [];

        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: true })
            .then(stream => {
                document.getElementById('preview').srcObject = stream;
                mediaRecorder = new MediaRecorder(stream);
                mediaRecorder.ondataavailable = e => chunks.push(e.data);
                mediaRecorder.onstop = () => {
                    const blob = new Blob(chunks, { type: 'video/mp4' });
                    const url = URL.createObjectURL(blob);
                    
                    // 1. 画面にプレビューを表示
                    const video = document.createElement('video');
                    video.src = url;
                    video.className = 'clip';
                    video.controls = true;
                    document.getElementById('vlogList').prepend(video);

                    // 2. スマホ本体に自動ダウンロード（保存）
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `vlog_${new Date().getTime()}.mp4`;
                    a.click();

                    chunks = [];
                    document.getElementById('status').innerText = "保存完了！";
                    setTimeout(() => document.getElementById('status').innerText = "", 2000);
                };
            });

        document.getElementById('recBtn').onclick = () => {
            if (mediaRecorder && mediaRecorder.state === "inactive") {
                mediaRecorder.start();
                document.getElementById('status').innerText = "録画中...";
                setTimeout(() => mediaRecorder.stop(), 1000); // 1秒固定
            }
        };
    </script>
</body>
</html>
