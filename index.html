<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>高画質Vlog・完成編</title>
    <style>
        body { font-family: sans-serif; background: #0a0a0a; color: white; text-align: center; margin: 0; }
        video#preview { width: 100%; height: 42vh; background: #000; object-fit: cover; }
        .controls { padding: 15px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
        #recBtn { width: 72px; height: 72px; border-radius: 50%; border: 4px solid white; background: #ff4444; box-shadow: 0 0 15px rgba(255,0,0,0.3); }
        #exportBtn { padding: 14px 28px; border-radius: 30px; border: none; background: #3a5aff; color: white; font-weight: bold; display: none; box-shadow: 0 4px 15px rgba(0,0,255,0.3); }
        #clearBtn { background: none; border: 1px solid #444; color: #777; font-size: 0.7rem; padding: 5px 10px; border-radius: 5px; margin-top: 5px; }
        #status { color: #00ff88; font-size: 0.9rem; min-height: 1.4rem; margin: 5px; font-weight: 500; }
        .vlog-list { display: flex; overflow-x: auto; gap: 6px; padding: 12px; background: #151515; border-top: 1px solid #222; }
        video.clip { width: 75px; height: 75px; object-fit: cover; border-radius: 6px; border: 1px solid #333; }
        #hiddenCanvas { display: none; }
    </style>
</head>
<body>
    <video id="preview" autoplay playsinline muted></video>
    <div class="controls">
        <div id="status">準備中...</div>
        <button id="recBtn" title="録画開始"></button>
        <button id="exportBtn">🎬 高画質で合体して保存</button>
        <button id="clearBtn" onclick="clearData()">撮影履歴をリセット</button>
    </div>
    <div id="vlogList" class="vlog-list"></div>
    <canvas id="hiddenCanvas"></canvas>

    <script>
        // ==========================================
        // ★ お好みの秒数にいつでも変更できます
        // ==========================================
        const RECORD_SECONDS = 1.5; // 1.5秒
        // ==========================================

        let mediaRecorder;
        let db;
        const DB_NAME = "VlogDB_v2";
        const STORE_NAME = "clips";

        // データベース接続
        const request = indexedDB.open(DB_NAME, 1);
        request.onupgradeneeded = e => e.target.result.createObjectStore(STORE_NAME, { autoIncrement: true });
        request.onsuccess = e => {
            db = e.target.result;
            loadClips();
            document.getElementById('status').innerText = "カメラ準備完了";
        };

        // ★改善：カメラの解像度を「フルHD（1920x1080）」に明示的に指定して起動
        const cameraConstraints = {
            video: {
                facingMode: "environment",
                width: { ideal: 1920 },
                height: { ideal: 1080 }
            },
            audio: true
        };

        navigator.mediaDevices.getUserMedia(cameraConstraints)
            .then(stream => {
                document.getElementById('preview').srcObject = stream;
                document.getElementById('recBtn').onclick = () => {
                    const chunks = [];
                    
                    // 録画の画質（ビットレート）も少し引き上げてクオリティを担保
                    const recorder = new MediaRecorder(stream, {
                        mimeType: 'video/mp4',
                        videoBitsPerSecond: 5000000 // 5Mbps（綺麗かつ重すぎない絶妙なライン）
                    });
                    
                    recorder.ondataavailable = e => chunks.push(e.data);
                    recorder.onstop = () => saveToDB(new Blob(chunks, { type: 'video/mp4' }));
                    recorder.start();
                    document.getElementById('status').innerText = `● ${RECORD_SECONDS}秒録画中...`;
                    
                    setTimeout(() => recorder.stop(), RECORD_SECONDS * 1000);
                };
            }).catch(err => {
                // 万が一フルHDに対応していない場合のセーフティ
                console.log("高解像度モード失敗、通常モードで起動します", err);
                navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: true })
                    .then(stream => { document.getElementById('preview').srcObject = stream; });
            });

        function saveToDB(blob) {
            const tx = db.transaction(STORE_NAME, "readwrite");
            tx.objectStore(STORE_NAME).add(blob);
            tx.oncomplete = () => {
                loadClips();
                document.getElementById('status').innerText = "保存しました";
            };
        }

        function loadClips() {
            const list = document.getElementById('vlogList');
            list.innerHTML = "";
            const tx = db.transaction(STORE_NAME, "readonly");
            const store = tx.objectStore(STORE_NAME);
            let count = 0;
            store.openCursor().onsuccess = e => {
                const cursor = e.target.result;
                if (cursor) {
                    count++;
                    const video = document.createElement('video');
                    video.src = URL.createObjectURL(cursor.value);
                    video.className = 'clip';
                    list.appendChild(video);
                    cursor.continue();
                } else if (count > 0) {
                    document.getElementById('exportBtn').style.display = "block";
                    document.getElementById('status').innerText = `${count} シーンをストック中`;
                }
            };
        }

        // ダブルバッファ方式によるなめらかな合体
        document.getElementById('exportBtn').onclick = async () => {
            const status = document.getElementById('status');
            const tx = db.transaction(STORE_NAME, "readonly");
            const keys = await new Promise(resolve => {
                tx.objectStore(STORE_NAME).getAllKeys().onsuccess = e => resolve(e.target.result);
            });

            if (keys.length === 0) return;

            const canvas = document.getElementById('hiddenCanvas');
            const ctx = canvas.getContext('2d');
            
            const player1 = document.createElement('video');
            const player2 = document.createElement('video');
            [player1, player2].forEach(p => { p.muted = true; p.playsInline = true; });

            // 最初の1本を読み込んでサイズ決定
            const firstBlob = await getBlobByKey(keys[0]);
            const firstUrl = URL.createObjectURL(firstBlob);
            player1.src = firstUrl;
            await new Promise(r => player1.onloadedmetadata = r);
            
            // ★改善：合体用のスクリーンの解像度も、読み込んだ高画質動画にぴったり合わせる
            canvas.width = player1.videoWidth;
            canvas.height = player1.videoHeight;
            URL.revokeObjectURL(firstUrl);

            const stream = canvas.captureStream(30);
            
            // 合体後の動画のビットレートも高画質用に調整
            const recorder = new MediaRecorder(stream, { 
                mimeType: 'video/webm;codecs=vp9',
                videoBitsPerSecond: 6000000 // 6Mbps
            });
            const finalChunks = [];
            recorder.ondataavailable = e => finalChunks.push(e.data);
            recorder.start();

            let activePlayer = player1;
            let nextPlayer = player2;

            for (let i = 0; i < keys.length; i++) {
                status.innerText = `高画質で結合中... (${i + 1} / ${keys.length})`;
                
                if (i + 1 < keys.length) {
                    try {
                        const nextBlob = await getBlobByKey(keys[i + 1]);
                        nextPlayer.src = URL.createObjectURL(nextBlob);
                        nextPlayer.load();
                    } catch (e) {
                        console.log("次ファイルのプリロードに失敗しました");
                    }
                }

                try {
                    await activePlayer.play();
                    await new Promise((resolve, reject) => {
                        const timeout = setTimeout(() => reject(new Error("Timeout")), (RECORD_SECONDS + 2) * 1000);
                        
                        const draw = () => {
                            ctx.drawImage(activePlayer, 0, 0, canvas.width, canvas.height);
                            if (!activePlayer.paused && !activePlayer.ended) {
                                requestAnimationFrame(draw);
                            } else {
                                clearTimeout(timeout);
                                resolve();
                            }
                        };
                        draw();
                    });
                } catch (err) {
                    console.log(`${i + 1}個目の動画に問題があったためスキップします`);
                }

                if (activePlayer.src) {
                    URL.revokeObjectURL(activePlayer.src);
                    activePlayer.src = "";
                    activePlayer.load();
                }
                
                let temp = activePlayer;
                activePlayer = nextPlayer;
                nextPlayer = temp;
            }

            setTimeout(() => {
                recorder.stop();
            }, 100);

            recorder.onstop = () => {
                const finalBlob = new Blob(finalChunks, { type: 'video/webm' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(finalBlob);
                a.download = `high_quality_vlog_${Date.now()}.webm`;
                a.click();
                status.innerText = "完成！高画質動画として保存しました";
            };
        };

        function getBlobByKey(key) {
            return new Promise(resolve => {
                const tx = db.transaction(STORE_NAME, "readonly");
                tx.objectStore(STORE_NAME).get(key).onsuccess = e => resolve(e.target.result);
            });
        }

        function clearData() {
            if(confirm("撮影リストをリセットしますか？")) {
                const tx = db.transaction(STORE_NAME, "readwrite");
                tx.objectStore(STORE_NAME).clear();
                tx.oncomplete = () => location.reload();
            }
        }
    </script>
</body>
</html>
